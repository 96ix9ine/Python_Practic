[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python_practic_digits"
version = "1.0.0"
description = "Сквозной промышленный MLOps-конвейер для распознавания и сжатия изображений цифр (Вариант 16, Профиль P2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Сергей Старков", email = "sergstar2012@mail.ru"}
]
dependencies = [
    "pydantic>=2.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "torch>=2.0.0",
    "mlflow>=2.10.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "matplotlib>=3.7.0",
    "evidently>=0.7.23",
    "scipy>=1.10.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
train-ml = "src.models.train:main"
train-dl = "src.models.train_dl:main"
train-validator = "src.models.train_validator:main"
generate-data = "src.data.train_generator:main"
serve-api = "src.api.service:main"
monitor-run = "src.api.monitor:run_monitoring_session"
drift-check = "src.utils.drift_monitor:run_drift_monitoring"
build-manifest = "src.utils.manifest_builder:main"
